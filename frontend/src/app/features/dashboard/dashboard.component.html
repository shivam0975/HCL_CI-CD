<section class="hero py-5">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <div>
        <span class="section-label">Student Management System</span>
        <h1 class="h3 mb-1">Dashboard</h1>
        <p class="mb-0">Welcome! Select a module to get started. Logged in as <strong>{{ role() }}</strong>.</p>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-secondary btn-sm" routerLink="/login" (click)="logout()">Logout</a>
      </div>
    </div>

    <div class="row g-4">
      @for (mod of visibleModules; track mod.link) {
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
          <a [routerLink]="mod.link" class="text-decoration-none">
            <article class="feature-card text-center">
              <div class="feature-icon mx-auto">{{ mod.icon }}</div>
              <h3 class="h5 mb-2">{{ mod.title }}</h3>
              <p class="mb-0">{{ mod.desc }}</p>
            </article>
          </a>
        </div>
      }
    </div>
  </div>
</section>
